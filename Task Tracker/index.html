<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2 class="text-center color-primary">Task Tracker</h2>
    <img src="https://static.vecteezy.com/system/resources/thumbnails/020/811/037/small/time-schedule-and-business-management-concept-businessman-planning-work-tasks-and-making-schedule-using-calendar-illustration-vector.jpg" alt=""> <br>

<input type="text" id="task" placeholder="Enter task">
<button onclick="addTask()">Add</button>


<div id="list"></div>

<script>

let tasks = [];

function addTask() {

    let task = document.getElementById("task").value;

    tasks.push(task);

    document.getElementById("task").value = "";

    displayTasks();
}

function displayTasks() {

    let output = "";

    tasks.forEach(function(task, index) {

        output += `
            <p>
                ${task}  completed

                <button onclick="updateTask(${index})">
                    Update
                </button>

                <button onclick="deleteTask(${index})">
                    Delete
                </button>
            </p>
        `;
    });

    document.getElementById("list").innerHTML = output;
}
function completeTask(index) { 
    tasks[index].completed = true; 
    displayTasks(); 
}
function pendingTask(index){
    tasks[index].pending = false;
    displayTasks();

}    

function updateTask(index) {

    let newTask = prompt("Enter new task");

    tasks[index] = newTask;

    displayTasks();
}

function deleteTask(index) {

    tasks.splice(index, 1);

    displayTasks();
}

</script>

</body>
</html>
