<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Joke App</title>


   
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        body {
            background-image: url(https://img.magnific.com/free-vector/group-people-watching-funny-video-laughing-cartoon_1284-33366.jpg?semt=ais_hybrid&w=740&q=80);
            background-repeat: no-repeat;
            background-size:cover;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .joke-card {
            width: 100%;
            max-width: 600px;

            background-color: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow: 0 10px 30px black;

            text-align: center;
        }


        .joke-title {
            font-weight: bold;
            margin-bottom: 30px;
        }


        .setup {
            font-size: 22px;
            font-weight: 600;

            margin-bottom: 20px;
        }


        .punchline {
            font-size: 20px;

            color:darkgray;

            margin-bottom: 30px;
        }


        .btn-joke {
            padding: 12px 30px;

            border-radius: 30px;

            font-size: 18px;
        }

    </style>

</head>


<body>


    <div class="container">

        <div class="joke-card mx-auto">

            <h1 class="joke-title"> Random Jokes</h1>


        <div id="setup" class="setup">

          Click the button to get a joke!

        </div>


         <div id="punchline" class="punchline">

             The joke will appear here.

        </div>


           <button id="jokeBtn" class="btn btn-primary btn-joke" >

            GET JOKE 

            </button>

        </div>

    </div>



    

    <script>


        

        const apiURL =
            "https://official-joke-api.appspot.com/random_joke";



      

        const setup =
            document.getElementById("setup");

        const punchline =
            document.getElementById("punchline");

        const jokeBtn =
            document.getElementById("jokeBtn");



        

        async function getJoke() {

            try {


                

                setup.innerText = "Loading...";

                punchline.innerText = "";



              

                const response =
                    await fetch(apiURL);



               

                if (!response.ok) {

                    throw new Error(
                        "Failed to fetch joke"
                    );

                }



                

                const data =
                    await response.json();



                

                setup.innerText =
                    data.setup;




                punchline.innerText =
                    data.punchline;


            }

            catch (error) {


               

                setup.innerText =
                    "Oops! Something went wrong ";

                punchline.innerText =
                    "Please try again.";


                console.log(error);

            }

        }




        jokeBtn.addEventListener(
            "click",
            getJoke
        );


    </script>


</body>

</html>
